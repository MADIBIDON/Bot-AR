[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-opportunity-assistant"
version = "0.0.1"
description = "Retail opportunity monitoring and assisted-purchase system."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "config",
    "products",
    "connectors",
    "engine",
    "notifications",
    "database",
    "checkout",
    "security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
